[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-scape"
version = "v0.26.239.5"
description = "Turn live terrestrial events into generative musical performances."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tom Farley"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "netCDF4>=1.7,<2.0",
  "pywebview>=5.4,<6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
gaia-scape-server = "gaia_scape_host.__main__:main"
gaia-scape-gui = "gaia_scape_host.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaia_scape_host = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.png", "static/*.ico", "static/*.icns"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
