[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiascapes"
dynamic = ["version"]
description = "Turn live terrestrial events into generative musical performances."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Tom Farley"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4,<7.0"]
lightning = ["netCDF4>=1.7,<2.0"]
eumetsat = ["netCDF4>=1.7,<2.0", "eumdac>=3.0,<4.0"]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0.3,<10.0",
]

[project.urls]
Repository = "https://github.com/mot-yelraf/Gaiascapes"
Documentation = "https://github.com/mot-yelraf/Gaiascapes#readme"
Issues = "https://github.com/mot-yelraf/Gaiascapes/issues"

[project.scripts]
gaiascapes-server = "gaiascapes_host.__main__:main"
gaiascapes-gui = "gaiascapes_host.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "gaiascapes.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaiascapes_host = ["sanctsound_catalog.json", "templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.png", "static/*.ico", "static/*.icns", "static/*.webmanifest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
