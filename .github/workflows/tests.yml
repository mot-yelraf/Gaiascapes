name: Tests and package installation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and provider dependencies
        run: python -m pip install '.[dev,lightning,eumetsat]' wheel
      - name: Test with isolated runtime state
        shell: bash
        run: |
          export GAIA_SCAPE_DATA_DIR="$(mktemp -d)"
          python -m pytest -q
          python -m compileall -q src tests
          bash -n install.sh scripts/run_gaiascapes.sh scripts/run_gaiascapes_gui.sh scripts/run_supercollider.sh
      - name: Build and smoke-test a clean headless installation
        shell: bash
        run: |
          package_dir="$(mktemp -d)"
          python -m pip wheel --no-deps . --wheel-dir "$package_dir/wheels"
          python -m venv "$package_dir/venv"
          "$package_dir/venv/bin/python" -m pip install "$package_dir"/wheels/*.whl httpx
          export GAIA_SCAPE_DATA_DIR="$(mktemp -d)"
          "$package_dir/venv/bin/python" scripts/smoke_installed.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Windows test and desktop dependencies
        run: |
          python -m pip install '.[dev,desktop,lightning,eumetsat]' wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import webview; import webview.platforms.winforms"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test with isolated runtime state
        run: |
          $env:GAIA_SCAPE_DATA_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:GAIA_SCAPE_DATA_DIR | Out-Null
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test PowerShell installation, shortcuts, and repair
        run: |
          $env:GAIA_SCAPE_DATA_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $env:GAIA_SCAPE_DATA_DIR | Out-Null
          python scripts/smoke_windows_install.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
