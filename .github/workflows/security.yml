name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit
      - name: Audit runtime and optional dependencies
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          requirements = project['dependencies'] + sum(project['optional-dependencies'].values(), [])
          Path(os.environ['RUNNER_TEMP'], 'audit-requirements.txt').write_text('\n'.join(sorted(set(requirements))) + '\n')
          PY
          python -m pip_audit -r "$RUNNER_TEMP/audit-requirements.txt"
