name: Build installer apps

on:
  workflow_dispatch:
  push:
    branches: ['codex/installer-apps-*']

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install app and build dependencies
        if: matrix.os != 'macos-15-intel'
        run: python -m pip install -r packaging/requirements-build.txt '.[desktop,lightning,eumetsat]'
      - name: Resolve Intel dependencies for macOS 12
        if: matrix.os == 'macos-15-intel'
        run: |
          python -m pip wheel proxy_tools --wheel-dir installers/.cache/macos12-wheels
          python -m pip download --dest installers/.cache/macos12-wheels --find-links installers/.cache/macos12-wheels --platform macosx_12_0_x86_64 --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 -r packaging/requirements-build.txt '.[desktop,lightning,eumetsat]' setuptools wheel
          python -m pip install --no-index --find-links installers/.cache/macos12-wheels setuptools wheel
          python -m pip install --no-index --find-links installers/.cache/macos12-wheels --no-build-isolation -r packaging/requirements-build.txt '.[desktop,lightning,eumetsat]'
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build and verify native installers
        if: matrix.os != 'macos-15-intel'
        run: python scripts/build_installers.py
      - name: Build and audit macOS 12 Intel installers
        if: matrix.os == 'macos-15-intel'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: python scripts/build_installers.py --macos-min-version 12.0
      - name: Verify native macOS Quit cleanup
        if: runner.os == 'macOS'
        run: python scripts/smoke_macos_quit.py installers/build-*/dist/Gaiascapes.app
      - name: Save installer outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            installers/*.dmg
            installers/*.pkg
            installers/*.exe
            installers/*.json
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: debian:bookworm
    steps:
      - name: Install build and desktop packages
        run: |
          apt-get update
          apt-get install -y ca-certificates git python3 python3-venv python3-pip python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 binutils dpkg-dev ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and verify native Debian installers
        run: |
          python3 -m venv --system-site-packages /tmp/gaiascapes-build
          /tmp/gaiascapes-build/bin/python -m pip install -r packaging/requirements-build.txt '.[desktop,lightning,eumetsat]'
          /tmp/gaiascapes-build/bin/python scripts/build_installers.py
      - name: Verify package payload and guide
        run: |
          dpkg-deb --info installers/*.deb
          dpkg-deb --contents installers/*.deb > /tmp/gaiascapes-payload.txt
          test "$(rg -c '/usr/share/doc/gaiascapes/user_guide.pdf' /tmp/gaiascapes-payload.txt)" = 1
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            installers/*.deb
            installers/*.json
          if-no-files-found: error
